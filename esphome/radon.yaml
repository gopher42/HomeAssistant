esphome:
  name: radon
  friendly_name: radon

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret radon_api_key


ota:
  password: !secret radon_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Radon Fallback Hotspot"
    password: !secret radon_ap_password

captive_portal:
    
