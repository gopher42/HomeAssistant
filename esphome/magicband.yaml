esphome:
  name: magicband
  friendly_name: MagicBand
  on_boot:
    priority: -100
    then:
      - delay: 3s  # let the DFPlayer finish starting up
      - dfplayer.set_volume: 20  # higher volumes distort on this speaker

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret magicband_api_key
  actions:
  - action: dfplayer_next
    then:
      - dfplayer.play_next:
  - action: dfplayer_previous
    then:
      - dfplayer.play_previous:
  - action: dfplayer_play
    variables:
      file: int
    then:
      - dfplayer.play: !lambda 'return file;'
  - action: dfplayer_play_loop
    variables:
      file: int
      loop_: bool
    then:
      - dfplayer.play:
          file: !lambda 'return file;'
          loop: !lambda 'return loop_;'
  - action: dfplayer_play_folder
    variables:
      folder: int
      file: int
    then:
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          file: !lambda 'return file;'

  - action: dfplayer_play_loop_folder
    variables:
      folder: int
    then:
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          loop: true

  - action: dfplayer_set_device_tf
    then:
      - dfplayer.set_device: TF_CARD

  - action: dfplayer_set_device_usb
    then:
      - dfplayer.set_device: USB

  - action: dfplayer_set_volume
    variables:
      volume: int
    then:
      - dfplayer.set_volume: !lambda 'return volume;'
  - action: dfplayer_set_eq
    variables:
      preset: int
    then:
      - dfplayer.set_eq: !lambda 'return static_cast<dfplayer::EqPreset>(preset);'

  - action: dfplayer_sleep
    then:
      - dfplayer.sleep

  - action: dfplayer_reset
    then:
      - dfplayer.reset

  - action: dfplayer_start
    then:
      - dfplayer.start

  - action: dfplayer_pause
    then:
      - dfplayer.pause

  - action: dfplayer_stop
    then:
      - dfplayer.stop

  - action: dfplayer_random
    then:
      - dfplayer.random

  - action: dfplayer_volume_up
    then:
      - dfplayer.volume_up

  - action: dfplayer_volume_down
    then:
      - dfplayer.volume_down
ota:
  - platform: esphome
    password: !secret magicband_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Magicband Fallback Hotspot"
    password: !secret magicband_ap_password

captive_portal:

spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6
  
rc522_spi:
  cs_pin: D2
  data_rate: 1MHz  # slower than the 4MHz default; more tolerant of long jumper wires
  update_interval: 1s
  on_tag:
    then:
      - homeassistant.tag_scanned: !lambda 'return x;'

binary_sensor:
  - platform: rc522
    uid: B3-7B-B7-03
    name: "RC522 RFID Tag"
    on_press:
      then:
        - script.execute: magic_show

  - platform: rc522
    uid: 04-5B-0F-3A-DE-1C-90
    name: "Second MagicBand"
    on_press:
      then:
        - script.execute: magic_show

# The light and sound show, shared by every band.
# mode: single ignores a new tap while the show is still running.
script:
  - id: magic_show
    mode: single
    then:
      # Both rings start the white scan together
      - light.turn_on:
          id: light2
          effect: "Green Scan"  # the effect's name; it actually sweeps white
          brightness: 100%
      - light.turn_on:
          id: light3
          effect: "Green Scan"
          brightness: 100%
      - dfplayer.play_folder:
          folder: 1
          file: 1
      - delay: 1.0s
      # Both rings go solid green together
      - light.turn_on:
          id: light3
          effect: None
          brightness: 100%
          red: 0
          green: 1.0
          blue: 0
      - light.turn_on:
          id: light2
          effect: None
          brightness: 100%
          red: 0
          green: 1.0
          blue: 0
      - delay: 1.5s
      - light.turn_off: light2
      - light.turn_off: light3
      - delay: 2s  # short pause so one tap doesn't trigger twice

# DFPlayer Mini configuration to play MP3
uart:
  id: uart_bus
  rx_pin: D4  # RX Pin (D1 Mini). Not D8: GPIO15 must be low at boot and the DFPlayer TX idles high
  tx_pin: D1  # TX Pin (D1 Mini)
  baud_rate: 9600

dfplayer:
  uart_id: uart_bus  

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: D3
    num_leds: 120
    name: "Full NeoPixel Strip"
    id: light1

  - platform: partition
    id: light2
    name: "Partition Light 1"
    effects:
      - addressable_lambda:
          name: "Green Scan"
          update_interval: 20ms
          lambda: |-
            const uint32_t lap_ms = 900;  // time for one lap
            const int width = 5;          // LEDs lit at once
            static uint32_t start = 0;
            if (initial_run) {
              start = millis();
            }
            const int n = it.size();
            const int offset = n / 2;     // start 180 degrees around from the inner ring
            const uint32_t elapsed = (millis() - start) % lap_ms;
            const int head = (elapsed * n / lap_ms + offset) % n;
            it.all() = Color::BLACK;
            for (int k = 0; k < width; k++) {
              it[(head - k + n) % n] = Color(255, 255, 255);  // tail wraps around the ring
            }
    segments:
      - id: light1
        from: 75
        to: 107

  - platform: partition
    name: "Partition Light 2"
    id: light3
    effects:
      - addressable_lambda:
          name: "Green Scan"
          update_interval: 20ms
          lambda: |-
            const uint32_t lap_ms = 900;  // time for one lap
            const int width = 5;          // LEDs lit at once
            static uint32_t start = 0;
            if (initial_run) {
              start = millis();
            }
            const int n = it.size();
            const uint32_t elapsed = (millis() - start) % lap_ms;
            const int head = elapsed * n / lap_ms;  // 0 .. n-1
            it.all() = Color::BLACK;
            for (int k = 0; k < width; k++) {
              it[(head - k + n) % n] = Color(255, 255, 255);  // tail wraps around the ring
            }
    segments:
      - id: light1
        from: 0
        to: 45
