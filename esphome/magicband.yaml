esphome:
  name: magicband
  friendly_name: MagicBand
  on_boot:
    priority: -100
    then:
      - delay: 3s  # let the DFPlayer finish starting up
      - dfplayer.set_volume: 20  # higher volumes distort on this speaker

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret magicband_api_key
  actions:
  - action: dfplayer_next
    then:
      - dfplayer.play_next:
  - action: dfplayer_previous
    then:
      - dfplayer.play_previous:
  - action: dfplayer_play
    variables:
      file: int
    then:
      - dfplayer.play: !lambda 'return file;'
  - action: dfplayer_play_loop
    variables:
      file: int
      loop_: bool
    then:
      - dfplayer.play:
          file: !lambda 'return file;'
          loop: !lambda 'return loop_;'
  - action: dfplayer_play_folder
    variables:
      folder: int
      file: int
    then:
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          file: !lambda 'return file;'

  - action: dfplayer_play_loop_folder
    variables:
      folder: int
    then:
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          loop: true

  - action: dfplayer_set_device_tf
    then:
      - dfplayer.set_device: TF_CARD

  - action: dfplayer_set_device_usb
    then:
      - dfplayer.set_device: USB

  - action: dfplayer_set_volume
    variables:
      volume: int
    then:
      - dfplayer.set_volume: !lambda 'return volume;'
  - action: dfplayer_set_eq
    variables:
      preset: int
    then:
      - dfplayer.set_eq: !lambda 'return static_cast<dfplayer::EqPreset>(preset);'

  - action: dfplayer_sleep
    then:
      - dfplayer.sleep

  - action: dfplayer_reset
    then:
      - dfplayer.reset

  - action: dfplayer_start
    then:
      - dfplayer.start

  - action: dfplayer_pause
    then:
      - dfplayer.pause

  - action: dfplayer_stop
    then:
      - dfplayer.stop

  - action: dfplayer_random
    then:
      - dfplayer.random

  - action: dfplayer_volume_up
    then:
      - dfplayer.volume_up

  - action: dfplayer_volume_down
    then:
      - dfplayer.volume_down
ota:
  - platform: esphome
    password: !secret magicband_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Magicband Fallback Hotspot"
    password: !secret magicband_ap_password

captive_portal:

spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6
  
rc522_spi:
  cs_pin: D2
  data_rate: 1MHz  # slower than the 4MHz default; more tolerant of long jumper wires
  update_interval: 1s
  on_tag:
    then:
      - homeassistant.tag_scanned: !lambda 'return x;'

binary_sensor:
  - platform: rc522
    uid: B3-7B-B7-03
    name: "RC522 RFID Tag"
    on_press:
      then:
        - light.turn_on:
            id: light2
            effect: "Green Scan"  # Trigger the Green Scan effect
            brightness: 100%  # No need for separate RGB values when using effects
        - dfplayer.play_folder:
            folder: 1
            file: 1
        - delay: 1.0s
        - light.turn_on:
            id: light3
            brightness: 100%
            red: 0
            green: 1.0
            blue: 0
        - delay: 0.5s
        - light.turn_off:
            id: light2
        - delay: 1s
        - light.turn_off:
            id: light3
        # Finish with both partitions solid green
        - light.turn_on:
            id: light2
            effect: None
            brightness: 100%
            red: 0
            green: 1.0
            blue: 0
        - light.turn_on:
            id: light3
            brightness: 100%
            red: 0
            green: 1.0
            blue: 0
        - delay: 3s
        - light.turn_off: light2
        - light.turn_off: light3
        - delay: 2s  # Add a short delay to prevent double triggering

# DFPlayer Mini configuration to play MP3
uart:
  id: uart_bus
  rx_pin: D4  # RX Pin (D1 Mini). Not D8: GPIO15 must be low at boot and the DFPlayer TX idles high
  tx_pin: D1  # TX Pin (D1 Mini)
  baud_rate: 9600

dfplayer:
  uart_id: uart_bus  

light:
  # Define the full light (source) controlling all 60 LEDs
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: D3
    num_leds: 120
    name: "Full NeoPixel Strip"
    id: light1

  # First segment (LEDs 0-29)
  - platform: partition
    id: light2
    name: "Partition Light 1"
    effects:
      # - addressable_scan:
      # - addressable_scan:
      #     name: Scan Effect With Custom Values
      #     move_interval: 20ms
      #     scan_width: 3
      - addressable_lambda:
          name: "Green Scan"
          update_interval: 25ms
          lambda: |-
            static int step = 0;
            static int num_leds_on = 1;  // Start with 1 LED on
            static int last_step = -1;   // To track the previous step

            // Initialize the scan on first run
            if (initial_run) {
              step = 0;
              num_leds_on = 1;  // Start with 1 LED
              last_step = -1;
            }

            // Turn off the previous block's LEDs
            if (last_step >= 0) {
              for (int i = last_step; i < last_step + num_leds_on; i++) {
                if (i < it.size()) {
                  it[i] = Color(0, 0, 0);  // Turn off the previous LEDs (BLACK)
                }
              }
            }

            // Set the current block of LEDs to green
            for (int i = step; i < step + num_leds_on; i++) {
              if (i < it.size()) {
                it[i] = Color(255, 255, 255);  // Set to green
              }
            }

            // Update last_step and increment the step
            last_step = step;
            step = step + 1;

            // After moving through the strip, reset to 0 and increase num_leds_on
            if (step >= it.size()) {
              step = 0;  // Wrap around to the start
              num_leds_on = (num_leds_on % 3) + 1;  // Cycle through 1, 2, 3 LEDs on
            }
    segments:
      - id: light1
        from: 75
        to: 107

  # Second segment (LEDs 30-59)
  - platform: partition
    name: "Partition Light 2"
    id: light3
    segments:
      - id: light1
        from: 0
        to: 45
