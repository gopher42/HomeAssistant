esphome:
  name: dryer-s31
  friendly_name: dryer_s31

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret dryer_s31_api_key

ota:
  password: !secret dryer_s31_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.30.7
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dryer-S31 Fallback Hotspot"
    password: !secret dryer_s31_ap_password

captive_portal:
    
