
# Loads default set of integrations. Do not remove.
default_config:

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
frontend:
  themes: !include_dir_merge_named themes

# Calculate Remaining Power
template:
  - sensor:
      name: Temperature Difference
      unit_of_measurement: 'F'
      state: > 
         {{ '%0.1f' | format (states('sensor.upstairs_temperature', rounded=True) | float - states('sensor.family_room_temperature', rounded=True) | float)}}


  - cover:
      - name: "Garage Door"
        unique_id: garage_door
        device_class: garage
        state: >
          {% if is_state('binary_sensor.garage_door_input', 'off') %}
            closed
          {% else %}
            open
          {% endif %}
        open_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.garage_door
          - delay:
              seconds: 1
          - action: switch.turn_off
            target:
              entity_id: switch.garage_door
        close_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.garage_door
          - delay:
              seconds: 1
          - action: switch.turn_off
            target:
              entity_id: switch.garage_door


mqtt:
  sensor:
  - state_topic: "plates"
    name: "Plates"
    
  - name: "Plate ID"
    state_topic: "plates"
    value_template: "{{ value_json.plate }}"

  binary_sensor:
  - state_topic: "blue_iris/binary_sensor/fys_motion/state"
    name: "Front Yard South Motion"
    payload_on: "ON"
    payload_off: "OFF"
    off_delay: 30
    device_class: motion
  - state_topic: "blue_iris/binary_sensor/bys_motion/state"
    name: "Back Yard South Motion"
    payload_on: "ON"
    payload_off: "OFF"
    off_delay: 30
    device_class: motion
  - state_topic: blue_iris/binary_sensor/basement_motion/state
    name: "Basement Motion"
    payload_on: "ON"
    payload_off: "OFF"
    device_class: motion
    off_delay: 30
  - state_topic: blue_iris/binary_sensor/garage_motion/state
    name: "Garage Motion"
    payload_on: "ON"
    payload_off: "OFF"
    device_class: motion
    off_delay: 30
  - state_topic: blue_iris/binary_sensor/fyn_motion/state
    name: "Front Yard North Motion"
    payload_on: "ON"
    payload_off: "OFF"
    device_class: motion
    off_delay: 30
  - state_topic: blue_iris/binary_sensor/byn_motion/state
    name: "Back Yard North Motion"
    payload_on: "ON"
    payload_off: "OFF"
    device_class: motion
    off_delay: 30