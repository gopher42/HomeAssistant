- id: '1656339706579'
  alias: Kitchen Main Lighting Turn On
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.kitchen_motion_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 0
    from:
    - 'off'
    to:
    - 'on'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '21:00:00'
        before: 05:00:00
        weekday:
        - sun
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
      sequence:
      - data:
          rgbw_color:
          - 255
          - 255
          - 0
          - 255
        target:
          entity_id:
          - light.wine_rack_lights
          - light.pantry_toe_kick
          - light.under_sink_toe_kick
          - light.kitchen_cooktop
        action: light.turn_on
    - conditions:
      - condition: time
        after: 05:00:00
        before: '21:00:00'
        weekday:
        - sun
        - mon
        - wed
        - tue
        - thu
        - sat
        - fri
      sequence:
      - data: {}
        target:
          entity_id: light.kitchen_main_lights
        action: light.turn_on
      - data:
          rgbw_color:
          - 255
          - 255
          - 0
          - 255
        target:
          entity_id:
          - light.wine_rack_lights
          - light.pantry_toe_kick
          - light.under_sink_toe_kick
          - light.kitchen_cooktop
        action: light.turn_on
        enabled: false
    default: []
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.living_room_christmas_tree
  mode: single
