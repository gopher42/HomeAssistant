- id: master_bathroom_lighting
  alias: Master Bathroom Lighting
  description: Occupancy-controlled master bathroom light with fades (off after 2 minutes clear).
  triggers:
  - trigger: state
    entity_id: binary_sensor.master_bathroom_occupancy
    from: 'off'
    to: 'on'
    id: 'on'
  - trigger: state
    entity_id: binary_sensor.master_bathroom_occupancy
    to: 'off'
    for:
      minutes: 2
    id: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.master_bathroom_channel_1
        data:
          transition: 10
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.master_bathroom_channel_1
        data:
          transition: 15
  mode: queued
