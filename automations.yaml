- id: master_bedroom_remote
  alias: Master Bedroom Remote
  description: Hue dimmer "Master Remote" - On toggles the master lamps, Off turns them off (Zigbee2MQTT 2.x action via MQTT).
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Master Remote
    value_template: '{{ value_json.action }}'
    payload: on_press
    id: 'on'
  - trigger: mqtt
    topic: zigbee2mqtt/Master Remote
    value_template: '{{ value_json.action }}'
    payload: off_press
    id: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.master_lamps
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.master_lamps
  mode: queued
- id: kitchen_main_lighting
  alias: Kitchen Main Lighting
  description: Kitchen lights follow occupancy - night mode (21:00-05:00) uses accent lights only; all off after 2 minutes
    clear.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion_occupancy
    from: 'off'
    to: 'on'
    id: 'on'
  - trigger: state
    entity_id: binary_sensor.kitchen_motion_occupancy
    from: 'on'
    to: 'off'
    for:
      minutes: 2
    id: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: '21:00:00'
            before: 05:00:00
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.wine_rack_lights
              - light.pantry_toe_kick
              - light.under_sink_toe_kick
              - light.kitchen_cooktop
            data:
              rgbw_color:
              - 255
              - 255
              - 0
              - 255
        default:
        - action: light.turn_on
          target:
            entity_id: light.kitchen_main_lights
      - action: switch.turn_on
        target:
          entity_id: switch.living_room_christmas_tree
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - type: turn_off
        device_id: 6781d65465cf59b755ee99aa45978c38
        entity_id: 998bd13a8ebd142bbbe117617550ff70
        domain: light
      - action: light.turn_off
        target:
          entity_id:
          - light.kitchen_toe_kick
          - light.wine_rack_lights
          - light.kitchen_cooktop_toe_kick
          - light.under_sink_toe_kick
          - light.pantry_toe_kick
      - action: switch.turn_off
        target:
          entity_id: switch.living_room_christmas_tree
  mode: queued
- id: vacation_mode_alerts
  alias: Vacation Mode Alerts
  description: While vacation mode is on, notify Sam's iPhone about doors opening and motion inside.
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_contact
    from: 'off'
    to: 'on'
    id: front_door
  - trigger: state
    entity_id: cover.garage_door
    from: closed
    to: open
    id: garage_door
  - trigger: state
    entity_id: binary_sensor.sliding_door_contact
    from: 'off'
    to: 'on'
    id: back_door
  - trigger: state
    entity_id: binary_sensor.kitchen_motion_occupancy
    from: 'off'
    to: 'on'
    id: kitchen_motion
  - trigger: state
    entity_id: binary_sensor.entryway_motion_occupancy
    from: 'off'
    to: 'on'
    id: entry_motion
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  actions:
  - variables:
      text:
        front_door:
        - Front Door is Open
        - The Front Door opened. Check it out!
        garage_door:
        - Garage Door Open
        - Garage Door is open. Check it out!
        back_door:
        - Back Door Open
        - The back (sliding) door opened. Check it out!
        kitchen_motion:
        - Kitchen Motion Detected
        - Motion in the kitchen! Check the cameras!
        entry_motion:
        - Front Entry Motion
        - Motion is detected in the front Entry. Check the cameras out!
  - action: notify.mobile_app_sams_iphone
    data:
      title: '{{ text[trigger.id][0] }}'
      message: '{{ text[trigger.id][1] }}'
  mode: queued
- id: low_battery_alert
  alias: Low Battery Alert
  description: Saturday 10:00 - list every battery sensor below 20% (phones and tablets excluded).
  triggers:
  - trigger: time
    at: '10:00:00'
    weekday:
    - sat
  conditions:
  - condition: template
    value_template: '{{ low | count > 0 }}'
  actions:
  - action: notify.mobile_app_sams_iphone
    data:
      title: Batteries to replace
      message: '{{ low | join(", ") }}'
  variables:
    low: "{% set ns = namespace(l=[]) %} {% for s in states.sensor | selectattr('attributes.device_class', 'defined')\n  \
      \   | selectattr('attributes.device_class', 'eq', 'battery') %}\n  {% if s.state | is_number and s.state | float < 20\n\
      \        and not s.entity_id is search('iphone|ipad|phone|watch') %}\n    {% set ns.l = ns.l + [s.name ~ ' (' ~ s.state\
      \ | int ~ '%)'] %}\n  {% endif %}\n{% endfor %} {{ ns.l }}"
  mode: single
- id: critical_device_offline_alert
  alias: Critical Device Offline Alert
  description: Notify when a security or safety device has been unavailable for 30 minutes.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door_contact
    - binary_sensor.garage_door_contact
    - binary_sensor.sliding_door_contact
    - binary_sensor.basement_door_vibration
    - binary_sensor.kitchen_motion_occupancy
    - binary_sensor.entryway_motion_occupancy
    - switch.garage_door
    - switch.shutoff_valve
    to: unavailable
    for:
      minutes: 30
  conditions: []
  actions:
  - action: notify.mobile_app_sams_iphone
    data:
      title: Device offline
      message: '{{ trigger.to_state.name }} has been unavailable for 30 minutes.'
  mode: queued
