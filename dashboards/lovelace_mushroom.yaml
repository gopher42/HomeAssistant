- theme: Backend-selected
  title: cameras
  path: cameras
  icon: mdi:cctv
  badges: []
  cards:
  - type: grid
    square: false
    columns: 1
    cards:
    - type: entities
      entities:
      - entity: binary_sensor.fys_motion
        name: Motion
      - entity: binary_sensor.fys_person
        name: Person
      - entity: binary_sensor.fys_pet
        name: Pet
      - entity: binary_sensor.fys_vehicle
        name: Vehicle
      title: FYS
    - show_state: false
      show_name: false
      camera_view: auto
      fit_mode: cover
      type: picture-entity
      entity: camera.fys_sub
  - show_state: false
    show_name: false
    camera_view: auto
    fit_mode: cover
    type: picture-entity
    entity: camera.fyn_sub_2
    camera_image: camera.fys_sub
  - show_state: false
    show_name: false
    camera_view: auto
    fit_mode: cover
    type: picture-entity
    entity: camera.bys_fluent
    camera_image: camera.fys
  - show_state: false
    show_name: false
    camera_view: auto
    fit_mode: cover
    type: picture-entity
    entity: camera.byn_fluent
    camera_image: camera.front_yard_north
  - type: grid
    square: false
    columns: 1
    cards:
    - type: entities
      entities:
      - entity: binary_sensor.garage_motion_2
        name: Motion
      title: Garage
    - type: picture-entity
      entity: camera.garage_fluent
